<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alicia — Médiamaticienne</title>

  <style>
    /* Mise en page générale */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222222;
      line-height: 1.6;
    }

    main {
      width: min(90%, 800px);
      margin: 0 auto;
      padding: 60px 0;
    }

    /* Bloc de présentation */
    .presentation {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-top: 6px solid #9e1b1b;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 2.6rem;
      color: #9e1b1b;
    }

    .intro {
      margin-top: 0;
      font-size: 1.2rem;
    }

    h2 {
      margin-top: 32px;
      font-size: 1.4rem;
    }

    ul {
      padding-left: 22px;
    }

    li {
      margin-bottom: 8px;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background-color: #9e1b1b;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover,
    a:focus {
      background-color: #8c1717;
    }

    /* Adaptation pour les petits écrans */
    @media (max-width: 600px) {
      main {
        padding: 24px 0;
      }

      .presentation {
        padding: 24px;
      }

      h1 {
        font-size: 2rem;
      }

      .intro {
        font-size: 1.05rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="presentation">
      <h1>Alicia (Lici) </h1>

      <p class="intro">
        Jeune médiamaticienne, créative et grande fan de la couleur rouge.
      </p>

      <h2>Mes compétences et centres d’intérêt</h2>

      <ul>
        <li>Design</li>
        <li>Réseaux sociaux</li>
        <li>Photographie</li>
      </ul>

      <a href="https://github.com/aliciaocchipinti" target="_blank" rel="noopener noreferrer">
        Voir mon profil GitHub
      </a>
    </section>
  </main>
</body>
</html>
